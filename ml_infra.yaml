AWSTemplateFormatVersion: '2010-09-09'
Description: 'IaC template for VPC with Fargate containers and EC2 instances'

Parameters:
  
    
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

Resources:
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: MainVPC

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MainIGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PublicSubnet

  # Private Subnet
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet

  # NAT Gateway for private subnet internet access
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: MainNATGateway

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PrivateRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  RestApiContainerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for rest-api-container
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 49134
          ToPort: 49134
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: RestApiContainerSG


  CallerWorkerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for caller_worker EC2
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 49134
          ToPort: 49134
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CallerWorkerSG

  InferenceWorkerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for inference_worker EC2
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 49134
          ToPort: 49134
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: InferenceWorkerSG

  # Security Group Ingress Rules (created separately to avoid circular dependencies)
  
  CallerWorkerIngressFromInferenceWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CallerWorkerSG
      IpProtocol: tcp
      FromPort: 49134
      ToPort: 49134
      SourceSecurityGroupId: !Ref InferenceWorkerSG



  InferenceWorkerIngressFromCallerWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InferenceWorkerSG
      IpProtocol: tcp
      FromPort: 49134
      ToPort: 49134
      SourceSecurityGroupId: !Ref CallerWorkerSG

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: MainCluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # ECS Task Execution Role
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Task Definitions
 

  RestApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: rest-api-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 256
      Memory: 512
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      ContainerDefinitions:
        - Name: rest-api-container
          Image: python:3.9-slim
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          Command:
            - /bin/sh
            - -c
            - |
              pip install fastapi uvicorn iii &&
              cat > /app/main.py << 'EOF'
              from fastapi import FastAPI, Query
              from iii import register_worker

              # Connect API container to III orchestrator
              iii = register_worker(
                  "ws://localhost:49134"
              )

              app = FastAPI()


              @app.get("/v1/chat/completions")
              async def chat_completions(prompt: str = Query(...)):

                  payload = {
                      "messages": [
                          {
                              "role": "user",
                              "content": prompt
                          }
                      ]
                  }

                  # Trigger caller worker
                  result = await iii.trigger({
                      "function_id": "http::run_inference_over_http",
                      "payload": {
                          "body": payload
                      }
                  })

                  return {
                      "success": True,
                      "result": result
                  }
              EOF
              uvicorn main:app --host 0.0.0.0 --port 80
          WorkingDirectory: /app
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RestApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # CloudWatch Log Groups
  IIIOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/iii-orchestrator
      RetentionInDays: 7

  RestApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/rest-api
      RetentionInDays: 7

  # ECS Services

  RestApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: rest-api-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref RestApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref RestApiContainerSG
          Subnets:
            - !Ref PublicSubnet
          AssignPublicIp: ENABLED

  # EC2 Instances
  CallerWorkerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref CallerWorkerSG
      Tags:
        - Key: Name
          Value: caller_worker

  InferenceWorkerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref InferenceWorkerSG
      Tags:
        - Key: Name
          Value: inference_worker

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${AWS::StackName}-VPC-ID

  PublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnet-ID

  PrivateSubnetId:
    Description: Private Subnet ID
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet-ID

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${AWS::StackName}-ECS-Cluster

  CallerWorkerInstanceId:
    Description: Caller Worker Instance ID
    Value: !Ref CallerWorkerInstance

  InferenceWorkerInstanceId:
    Description: Inference Worker Instance ID
    Value: !Ref InferenceWorkerInstance
